<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <title>Sign In</title>

    <link rel="stylesheet" href="../../../../../authservice/src/main/resources/static/css/style.css" th:href="@{/css/style.css}">
    <style>
        /* The login page has no nav, so .auth-body centres the card. */
        .container {
            max-width: 420px;
            width: 100%;
        }

        .container > header {
            text-align: center;
            display: block;          /* override the flex default */
            margin-bottom: 30px;
            padding-bottom: 10px;
        }
        .container > header p { color: var(--color-text-dim); font-size: 14px; margin-top: 5px; }

        .alert-success {
            background: rgba(30, 126, 52, 0.15);
            border: 1px solid rgba(30, 126, 52, 0.3);
            color: #81c995;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Sign In</h1>

    </header>

    <div th:if="${param.error}" class="alert-error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="alert-success">
        You have been signed out.
    </div>

    <form th:action="@{/signup}" th:object="${newUser}" method="post">

        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-submit">Sign Up</button>

        <p class="signup-link">
            Already have an Account? <a th:href="@{/signin}">Sign in page</a>
        </p>

    </form>

</div>


</body>
</html>
