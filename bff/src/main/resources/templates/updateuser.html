<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Account</title>

    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <style>
        /* The login page has no nav, so .auth-body centres the card. */
        .container {
            max-width: 420px;
            width: 100%;
        }

        .container > header {
            text-align: center;
            display: block; /* override the flex default */
            margin-bottom: 30px;
            padding-bottom: 10px;
        }
        .container > header p { color: var(--color-text-dim); font-size: 14px; margin-top: 5px; }


        .alert-success {
            background: rgba(30, 126, 52, 0.15);
            border: 1px solid rgba(30, 126, 52, 0.3);
            color: #81c995;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="auth-body">
<div class="nav-container">
    <button type="button" class="nav-link" onclick="deleteAccount()" style="background: transparent; color: #fff; border: 1px solid var(--glass-border);">Delete user</button>

    <form id="logoutform" th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Sign Out</button>
    </form>
</div>



    <div class="container">
        <!--/*@thymesVar id="currentuser" type=""*/-->
        <input type="hidden" th:name="${currentuser}">

        <header>
            <h1>Update User</h1>
        </header>

        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" placeholder="Update username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Update password" required>
        </div>

        <button onclick="updateAccount()" class="btn-submit">Save update</button>

    </div>


<script>
    // async function getRequestHeader() {
    //     const tokenMeta = document.querySelector("meta[name='_csrf']");
    //     const headerMeta = document.querySelector("meta[name='_csrf_header']");
    //
    //     const token = tokenMeta ? tokenMeta.getAttribute("content") : null;
    //     const header = headerMeta ? headerMeta.getAttribute("content") : null;
    //
    //     const requestHeaders = {
    //         'Content-Type': 'application/json'
    //     };
    //     if (token && header) {
    //         requestHeaders[header] = token;
    //     }
    //     return requestHeaders;
    // }

    async function updateAccount() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const requestHeaders = await getRequestHeader();

        try {
            const response = await fetch('/account', {
                method: 'POST',
                headers: requestHeaders,
                body: JSON.stringify({
                    username: username,
                    password: password,
                })
            });
            if (response.ok) {
                alert("Uppdateringen lyckades!");
                document.getElementById('username').value = "";
                document.getElementById('password').value = "";

            } else {
                const errorData = await response.json();
                let errormessage ="";
                for (const key in errorData) {
                    if (errorData.hasOwnProperty(key)) {
                        const value = errorData[key];

                        if (typeof value === 'object' && value !== null) {
                            errormessage += `${key}: ${JSON.stringify(value)}\n`;
                        } else {
                            errormessage += `${key}: ${value}\n`;
                        }
                    }
                }

                alert("Error saving account! Reason: "+ errormessage);
            }
        } catch (error) {
            console.error("Failed: " + error);
        }
    }

    async function deleteAccount() {
        let text = "Are you sure? Deleted user cannot be recovered"
        const requestHeaders = await getRequestHeader();
        if (confirm(text) == true) {
            try {
                const response = await fetch("/delete", {
                    method: 'DELETE',
                    headers: requestHeaders

                });
                if(response.ok) {
                    alert("Your account has been deleted!");
                    document.getElementById("logoutform").submit();
                }else {
                    alert("Could not delete account! Status: " + response.status)
                }
            } catch (error) {
                console.error("Error deleting user "+ error)
            }

        }
    }
</script>
</body>
</html>
