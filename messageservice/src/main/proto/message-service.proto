syntax = "proto3";

option java_package = "com.chatting.grpc.message";
option java_multiple_files = true;

service UserService {

  // Method to validate username, receives question and returns answer
  rpc ValidateUser (UserRequest) returns (UserResponse);

}

// Question sent
message UserRequest {
  string username = 1; // --> 1 = internal field number
}

// Answer received
message UserResponse{
  bool exists = 1;

}
