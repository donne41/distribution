spring.application.name=messageservice
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${AUTH_HOST:127.0.0.1}:9000
logging.level.org.springframework.security=TRACE

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/message_db
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.grpc.client.default-channel.address=static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:9090}
spring.grpc.client.default-channel.secure=${USER_SERVICE_GRPC_SECURE:true}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest



spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=DEBUG

server.port=8082
