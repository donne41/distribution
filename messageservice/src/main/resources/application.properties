spring.application.name=messageservice
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${AUTH_HOST:127.0.0.1}:9000
logging.level.org.springframework.security=TRACE

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/message_db
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.grpc.client.default-channel.address=static://localhost:9090
spring.grpc.client.default-channel.secure=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=DEBUG


server.port=8082
